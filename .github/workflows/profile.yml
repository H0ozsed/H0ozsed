# Regenerates the images of the profile README every day: the contribution stats card
# (scripts/stats.mjs) and the contribution snake (Platane/snk). They are published on the
# `output` branch, so the daily update adds no commit to `main`.
name: Profile images

on:
  schedule:
    - cron: '0 4 * * *' # every day at 04:00 UTC (08:00 in La Réunion)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stats card
        run: node scripts/stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish on the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
